apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # +1 pod pendant la mise à jour
      maxUnavailable: 0    # toujours 3 pods prêts
  selector:
    matchLabels:
      app: myapp-v
  template:
    metadata:
      labels:
        app: myapp-v
        version: v1
    spec:
      containers:
      - name: app
        image: nginx:1.27
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 5
