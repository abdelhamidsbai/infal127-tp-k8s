apiVersion: v1
kind: Pod
metadata:
  name: back-end-pas-pret
  labels:
    app: myapp
    type: back-end
spec:
  containers:
  - name: whoami
    image: traefik/whoami
    args: ["--port", "80"]
    readinessProbe:
      httpGet: {path: /, port: 8080}   # personne n'écoute sur 8080
      periodSeconds: 5
