apiVersion: v1
kind: Pod
metadata:
  name: secret-volume
spec:
  restartPolicy: Never
  containers:
  - name: check
    image: busybox:1.37
    command: ["sh", "-c"]
    args:
    - ls /etc/secrets; echo "DB_Password = $(cat /etc/secrets/DB_Password)"; mount | grep /etc/secrets
    volumeMounts:
    - name: secrets
      mountPath: /etc/secrets
      readOnly: true
  volumes:
  - name: secrets
    secret:
      secretName: app-secret
