apiVersion: v1
kind: Namespace
metadata:
  name: boutique
---
apiVersion: v1
kind: Pod
metadata:
  name: front
  namespace: boutique
  labels: {app: front}
spec:
  containers:
  - name: front
    image: busybox:1.37
    command: ["sleep", "3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: boutique
  labels: {app: api}
spec:
  containers:
  - name: api
    image: traefik/whoami
    args: ["--port", "8080"]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: boutique
spec:
  selector: {app: api}
  ports:
  - port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: db
  namespace: boutique
  labels: {app: db}
spec:
  containers:
  - name: db
    image: traefik/whoami      # une fausse base de données, qui répond en HTTP
    args: ["--port", "5432"]
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: boutique
spec:
  selector: {app: db}
  ports:
  - port: 5432
