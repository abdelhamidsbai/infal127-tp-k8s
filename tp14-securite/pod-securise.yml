apiVersion: v1
kind: Pod
metadata:
  name: pod-securise
spec:
  # niveau pod
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: api
    image: nginxinc/nginx-unprivileged:1.27
    ports:
    - containerPort: 8080
    # niveau conteneur
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: ["ALL"]}
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  volumes:
  - name: tmp
    emptyDir: {}
