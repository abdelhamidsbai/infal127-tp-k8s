apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backups.demo.cesi.fr
spec:
  group: demo.cesi.fr
  names:
    kind: Backup
    plural: backups
    singular: backup
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            description: Ce que l'on veut sauvegarder, et quand.
            required: [database, schedule]
            properties:
              database:
                type: string
                description: La base de données à sauvegarder.
                enum: [mysql, postgres]
              schedule:
                type: string
                description: L'heure de la sauvegarde, au format cron.
    additionalPrinterColumns:
    - name: Base
      type: string
      jsonPath: .spec.database
    - name: Planning
      type: string
      jsonPath: .spec.schedule
